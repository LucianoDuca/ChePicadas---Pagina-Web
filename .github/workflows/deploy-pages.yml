name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site folder
        run: |
          mkdir -p _site
          rsync -av \
            --exclude 'node_modules' \
            --exclude 'server.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            chepicadas-web/ _site/
          touch _site/.nojekyll

          # El sitio usa rutas absolutas (/css/..., /assets/...) pensadas para
          # servir desde la raíz del dominio (Express/dominio real). GitHub
          # Pages publica bajo un subpath, así que acá les anteponemos el
          # base_path que calculó configure-pages solo en la copia publicada.
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ -n "$BASE" ]; then
            find _site -name '*.html' -print0 \
              | xargs -0 sed -i -E "s#(href|src|srcset)=\"/#\1=\"${BASE}/#g"
            find _site -name '*.css' -print0 \
              | xargs -0 sed -i -E "s#url\((['\"]?)/#url(\1${BASE}/#g"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
